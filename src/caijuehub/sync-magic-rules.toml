# magic-sync 同步规则 — 模板文件到各 magic 目录的映射配置

[core]
# 项目名称（烘焙到 .md 占位符 {{projectName}}）
project_name = "add-coder"
# 所有目标 magic 目录
magic_dirs = [".add", ".qoder", ".claude", ".vscode", ".trae", ".codex"]

[exclude]
# 同步 + 验证时跳过的文件/目录
patterns = [".gitkeep", ".DS_Store", "debug-dump"]
log_extensions = [".log"]

# ── 配置入口校验正则（收拢到控制面，2026-08-18：脚本零正则硬编码）──
[config_check]
hook_path_re = "((?:\\.qoder|\\.claude|\\.trae|\\.codex|\\.vscode|\\.add)/hooks/[^\\s\"']+\\.mjs)"
legacy_sh_re = "\\.sh(?=[\"'\\s)])"

# ── Hook 同步：adapter 专属 hooks ──
[[hooks]]
src = "templates/adapters/claude/hooks"
dest = ".claude/hooks"
name = "claude hooks"
magic_dir = ".claude"

[[hooks]]
src = "templates/adapters/qoder/hooks"
dest = ".qoder/hooks"
name = "qoder hooks"
magic_dir = ".qoder"

[[hooks]]
src = "templates/adapters/vscode/hooks"
dest = ".vscode/hooks"
name = "vscode hooks"
magic_dir = ".vscode"

[[hooks]]
src = "templates/core/hooks"
dest = ".add/hooks"
name = ".add hooks"
magic_dir = ".add"

# ── Hook 同步：trae 独立源（Task 1.6 切断镜像）──
[[hooks]]
src = "templates/adapters/trae/hooks"
dest = ".trae/hooks"
name = "trae hooks"
magic_dir = ".trae"

# ── Hook 同步：codex（与 hook-bake BAKE_TARGETS 对齐，2026-08-18 runtime review #1 修复）──
[[hooks]]
src = "templates/adapters/codex/hooks"
dest = ".codex/hooks"
name = "codex hooks"
magic_dir = ".codex"

# ── 配置入口同步（R4 架构修正 2026-08-18：配置入口分发归 sync-magic，hook-bake 回归烘焙器）──
# placeholder_policy: none=原样复制 / replace=占位符渲染后覆盖（替换表见 replacements）
[[configs]]
src = "templates/adapters/qoder/settings.json"
dest = ".qoder/settings.json"
name = "qoder settings"
magic_dir = ".qoder"
placeholder_policy = "none"

[[configs]]
src = "templates/adapters/claude/settings.json"
dest = ".claude/settings.json"
name = "claude settings"
magic_dir = ".claude"
placeholder_policy = "none"

[[configs]]
src = "templates/adapters/trae/hooks.json"
dest = ".trae/hooks.json"
name = "trae hooks.json"
magic_dir = ".trae"
placeholder_policy = "none"

[[configs]]
src = "templates/adapters/codex/hooks.json"
dest = ".codex/hooks.json"
name = "codex hooks.json"
magic_dir = ".codex"
placeholder_policy = "none"

[[configs]]
src = "templates/adapters/vscode/settings.json"
dest = ".vscode/settings.json"
name = "vscode settings (Agent Host MCP)"
magic_dir = ".vscode"
placeholder_policy = "replace"

[configs.replacements]
projectName = "$PROJECT_NAME"
mcpServerCommand = "$MCP_SERVER_COMMAND"
projectRoot = "$PROJECT_DIR"

# ── 通用类别：批量同步到所有 magic 目录 ──
[[categories]]
name = "templates"
icon = "📚"
bake = false   # 保留 {{magicDir}} 占位符给 init 渲染

[[categories]]
name = "skills"
icon = "🎯"

[[categories]]
name = "rules"
icon = "📋"

[[categories]]
name = "agents"
icon = "🤖"

[[categories]]
name = "scripts"
icon = "📜"

[[categories]]
name = "docs"
icon = "📖"

[[categories]]
name = "vocabulary"
icon = "📕"

[[categories]]
name = "tools"
icon = "🔧"

# ── core 校验层（Plan core-validation-lifecycle）：hooks 烘焙内联 + MCP 侧运行态引用 ──
#   分发后各 magic 目录形如 .codex/validation/**，与 .codex/scripts/** 同级，
#   使 `shared/memory/calibration/unit-state.ts` 的相对引用（../../../../..）在源码与 magic 两侧一致
[[categories]]
name = "validation"
icon = "✅"

# ── 验证：同步后逐文件比对 ──
[[verify]]
src = "templates/adapters/claude/hooks"
dest = ".claude/hooks"
name = "claude hooks"

[[verify]]
src = "templates/adapters/qoder/hooks"
dest = ".qoder/hooks"
name = "qoder hooks"

[[verify]]
src = "templates/adapters/vscode/hooks"
dest = ".vscode/hooks"
name = "vscode hooks"

[[verify]]
src = "templates/core/hooks"
dest = ".add/hooks"
name = ".add hooks"

[[verify]]
src = "templates/adapters/trae/hooks"
dest = ".trae/hooks"
name = "trae hooks"

[[verify]]
src = "templates/core/templates"
dest = ".add/templates"
name = ".add templates"
