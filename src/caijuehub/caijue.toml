# ============================================================
# add-coder 集中裁决层 (Caijue Hub) — 策略索引
# ============================================================
# 本文档是 add-coder CLI 的裁决总览，注册所有决策点。
# 每条条目指向规则文件（rules）和策略文件（implementation）。
# 转录器根据规则 TOML 产出 GENERATED 区块，手写 USER CODE 消费规则数据。
#
# 裁决类型:
#   strategy = 策略/参数决策
# ============================================================

# ──── CLI 决策策略 ────────────────────────────────────────────

[[caijue]]
id = "detect-ide"
type = "strategy"
description = "IDE 环境检测优先级链：env 变量 → 目录检测 → 兜底"
rules = "detect-rules.toml"
implementation = "src/caijuehub/strategies/detect.strategy.ts"
line_type = "custom"
approval = "auto"

[[caijue]]
id = "resolve-adapters"
type = "strategy"
description = "根据 target 决定启用的适配器列表"
rules = "adapter-rules.toml"
implementation = "src/caijuehub/strategies/adapter.strategy.ts"
line_type = "custom"
approval = "auto"

[[caijue]]
id = "prisma-inject"
type = "strategy"
description = "Prisma 模型注入行为决策"
rules = "prisma-rules.toml"
implementation = "src/caijuehub/strategies/prisma.strategy.ts"
line_type = "custom"
approval = "auto"

[[caijue]]
id = "write-files"
type = "strategy"
description = "文件写入模式决策"
rules = "writer-rules.toml"
implementation = "src/caijuehub/strategies/writer.strategy.ts"
line_type = "custom"
approval = "auto"

[[caijue]]
id = "sync-patch"
type = "strategy"
description = "sync 命令行为：补缺 / --patch 覆盖更新，双 hash 校验 + PATCH_GUARD 保护"
rules = "sync-rules.toml"
implementation = "src/caijuehub/strategies/sync.strategy.ts"
line_type = "custom"
approval = "auto"

[[caijue]]
id = "hitl-interaction"
type = "strategy"
description = "HITL 人机交互策略：每个 IDE 独立声明审批交互模式（mcpApps / genui / inputRequired）"
rules = "hitl-interaction-rules.toml"
implementation = "templates/core/scripts/mcp-server/shared/hitl-interaction.strategy.ts"
line_type = "custom"
approval = "auto"

[[caijue]]
id = "dps-scoring"
type = "strategy"
description = "DPS 评分全参数：四维权重 + 阈值 + FFT，调优只改此 TOML"
rules = "dps-scoring-rules.toml"
implementation = "templates/core/scripts/mcp-server/shared/dps-scoring.strategy.ts"
line_type = "ts-const"
approval = "auto"
export_name = "DPS_SCORING_CONFIG"
fields = [
  ["SEMANTIC_WEIGHTS", "semantic", "weights", "arr"],
  ["SEMANTIC_MISSING_REVIEW_PENALTY", "semantic", "missing_review_penalty", "num"],
  ["ENTROPY_GAP_MULT", "entropy", "gap_multiplier", "num"],
  ["DENG_PER_MARKER", "entropy", "deng_per_marker", "num"],
  ["DENG_MAX_PENALTY", "entropy", "deng_max_penalty", "num"],
  ["MISSING_SPECS_GAP", "entropy", "missing_specs_gap", "num"],
  ["CPM_SUB_WEIGHTS", "cpm", "sub_weights", "arr"],
  ["CPM_OVERLAP_MULT", "cpm", "overlap_multiplier", "num"],
  ["CPM_MAX_TASK_PAIRS", "cpm", "max_task_pairs", "num"],
  ["CPM_FILE_LOW", "cpm", "file_per_task_low", "num"],
  ["CPM_FILE_MID", "cpm", "file_per_task_mid", "num"],
  ["CPM_ENTROPY_LOW", "cpm", "entropy_low", "num"],
  ["CPM_ENTROPY_MID", "cpm", "entropy_mid", "num"],
  ["CPM_ATTENTION_WEIGHTS", "cpm", "attention_weights", "arr"],
  ["CPM_DEP_WEIGHTS", "cpm", "dep_weights", "arr"],
  ["STRUCT_PLACEHOLDER", "structure", "placeholder_penalty", "num"],
  ["STRUCT_MISSING_SPECS", "structure", "missing_specs_penalty", "num"],
  ["STRUCT_MISSING_TASKS", "structure", "missing_tasks_penalty", "num"],
  ["STRUCT_MISSING_CHECKLIST", "structure", "missing_checklist_penalty", "num"],
  ["STRUCT_SUB_WEIGHTS", "structure", "sub_weights", "arr"],
  ["FFT_COLD_START", "fft", "cold_start_threshold", "num"],
  ["FFT_HISTORY_LIMIT", "fft", "history_limit", "num"],
  ["FFT_DEFAULT_WEIGHTS", "fft", "default_weights", "arr"],
  ["THRESHOLD_PASS", "thresholds", "pass", "num"],
  ["THRESHOLD_WARN", "thresholds", "warn", "num"],
  ["EMBEDDING_MODEL", "embedding", "model", "str"],
]

