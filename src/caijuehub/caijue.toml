fields = [
  ["ANCHOR_WEIGHT", "quant_recheck", "anchor_weight", "num"],
  ["IDF_MIN_DOCS", "quant_recheck", "idf_min_docs", "num"],
  ["RRF_K", "quant_recheck", "rrf_k", "num"],
  ["MIN_ABS_SIMILARITY", "quant_recheck", "min_abs_similarity", "num"],
  ["RRF_MIN_CANDIDATES", "quant_recheck", "rrf_min_candidates", "num"],
  ["EWMA_LAMBDA", "quant_recheck", "ewma_lambda", "num"],
  ["EWMA_K", "quant_recheck", "ewma_k", "num"],
