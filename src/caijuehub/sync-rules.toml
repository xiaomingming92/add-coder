# sync 命令行为规则

[guard]
# PATCH_GUARD: --patch 模式下也不写入的路径模式
patterns = ["[/]plans[/]", "[/]specs[/]", "[/]reviews[/]"]

[hash]
# 产出 hash 文件名
output_file = ".add-coder-hash.json"
# 源 hash 文件路径（相对于 npm 包 root）
src_file = "templates/.add-coder-src-hash.json"
# SHA256 截取前 N 位
hex_length = 8

[patch]
# 6 hash 矩阵 → 3 行为参数
on_missing = "write"             # ⑤ 文件不存在 → 静默写入
on_conflict = "interactive"      # ②④ 内容有差异 → selectFiles 交互
on_same = "skip"                 # ① 内容一致 → 跳过
# ⑥ PATCH_GUARD → guard.patterns
# ③ 用户改了源没变 → on_conflict: skip（用户选[a]）

[version]
# 3 版本边界 — 在 hash 矩阵之前判定
# installedVersion vs npmVersion
on_first_patch = "baseline"      # isFirstPatch → 静默写基线
on_upgrade = "baseline"          # isUpgrade → 静默写基线  
on_hash_lost = "conflict"        # hashLost → 全部进交互保护
sentinel_file = ".add-coder-version"

[default]
# 默认模式（无 --patch）
on_missing = "write"
on_existing = "skip"             # 已有文件不碰
prompt_full = "所有 ADD 模板文件已就位。使用 --patch 更新已有文件。"
prompt_patch_done = "所有 ADD 模板文件已是最新。"

# ═══════════════ Prisma schema 增量同步 ═══════════════
[prisma]
# add-coder 基准 schema（相对于消费项目根目录）
base_schema = "node_modules/add-coder/templates/core/prisma/add.prisma"
# 消费项目中对应的目标 schema
target_pattern = "prisma/add/schema.prisma"
# 同步项类型
sync_items = ["model", "enum"]
# ── 行为策略 ──
# interactive=交互确认，auto=静默执行，skip/ignore=跳过，block=阻断
on_missing_model = "interactive"  # 消费方缺表
on_field_conflict = "interactive" # 同名字段定义不同
on_missing_field = "interactive"  # 基准有、消费方无
on_extra_field = "ignore"         # 消费方特有（不做操作）
# 汇总提示
prompt = "add-coder 标准 add.prisma 与消费方 schema 存在差异。"