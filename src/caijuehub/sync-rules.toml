# sync 命令行为规则

[guard]
# PATCH_GUARD: --patch 模式下也不写入的路径模式
# rules/profiles/ = 技术栈约束文件（含用户自建自定义 profile），sync 不覆盖不删除 [回流: Review P1 #1]
patterns = ["[/]plans[/]", "[/]specs[/]", "[/]reviews[/]", "[/]rules[/]profiles[/]"]

[hash]
# 产出 hash 文件名
output_file = ".add-coder-hash.json"
# 源 hash 文件路径（相对于 npm 包 root）
src_file = "templates/.add-coder-src-hash.json"
# SHA256 截取前 N 位
hex_length = 8

[patch]
# 6 hash 矩阵 → 3 行为参数
on_missing = "write"             # ⑤ 文件不存在 → 静默写入
on_conflict = "interactive"      # ②④ 内容有差异 → selectFiles 交互
on_same = "skip"                 # ① 内容一致 → 跳过
# ⑥ PATCH_GUARD → guard.patterns
# ③ 用户改了源没变 → on_conflict: skip（用户选[a]）

[version]
# 3 版本边界 — 在 hash 矩阵之前判定
# installedVersion vs npmVersion
on_first_patch = "baseline"      # isFirstPatch → 静默写基线
on_upgrade = "baseline"          # isUpgrade → 静默写基线  
on_hash_lost = "conflict"        # hashLost → 全部进交互保护
sentinel_file = ".add-coder-version"

[default]
# 默认模式（无 --patch）
on_missing = "write"
on_existing = "skip"             # 已有文件不碰
prompt_full = "所有 ADD 模板文件已就位。使用 --patch 更新已有文件。"
prompt_patch_done = "所有 ADD 模板文件已是最新。"

# ═══════════════ Prisma schema 增量同步 ═══════════════
[prisma]
# add-coder 基准 schema（相对于消费项目根目录）
base_schema = "node_modules/add-coder/templates/core/prisma/add.prisma"
# 消费项目中对应的目标 schema
target_pattern = "prisma/add.prisma"
# 同步项类型
sync_items = ["model", "enum"]
# ── 行为策略 ──
# interactive=交互确认，auto=静默执行，skip/ignore=跳过，block=阻断
on_missing_model = "interactive"  # 消费方缺表
on_field_conflict = "interactive" # 同名字段定义不同
on_missing_field = "interactive"  # 基准有、消费方无
on_extra_field = "ignore"         # 消费方特有（不做操作）
# 汇总提示
prompt = "add-coder 标准 add.prisma 与消费方 schema 存在差异。"

# ── Post-Sync 动作指引（sync 写入差异后的迁移收尾）──
# 宿主状态判断：有 migrations 目录 → managed_actions；无 → unmanaged_actions

[prisma.post_sync]
header = "下一步按你的场景选择迁移命令:"
final = "npx prisma generate"

# 有 migrations 目录的宿主：dev / deploy / status 三选一
[[prisma.post_sync.managed_actions]]
label = "开发环境（生成新迁移+同步本地库）"
cmd = "npx prisma migrate dev"

[[prisma.post_sync.managed_actions]]
label = "生产/CI（只应用已有迁移）"
cmd = "npx prisma migrate deploy"

[[prisma.post_sync.managed_actions]]
label = "不确定？先查状态"
cmd = "npx prisma migrate status"

# P3005 基线化提示（仅在有 migrations 场景显示）
[prisma.post_sync.p3005]
hint = "若报 P3005（库有表但无迁移记录）= 需先基线化:"
cmd = "npx prisma migrate resolve --applied <��移名>，再执行 deploy"

# 无 migrations 目录的宿主：首次接入
[[prisma.post_sync.unmanaged_actions]]
label = "首次接入迁移管理（空库）"
cmd = "npx prisma migrate dev --name init"

[[prisma.post_sync.unmanaged_actions]]
label = "库已有表（db push 建过）"
hint = "先手动基线化，再 deploy:"
steps = [
    "npx prisma migrate diff --from-empty --to-schema-datamodel <schema文件> --script",
    "将输出写入 prisma/migrations/<时间戳>_init/migration.sql",
    "npx prisma migrate resolve --applied <时间戳>_init",
]