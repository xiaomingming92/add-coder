# ═══════════════════════════════════════════════════════════════
# hook-guard-rules.toml —— PreToolUse 拦截/守卫规则真源（§A/§B/§C）
# 消费方式: hook-rules-gen.ts → 生成 templates/core/hooks/lib/rules.guard.ts
# 改动规则: 只改本文件，运行生成器（产物带 _generated 标记，勿手改）
# 双源约定: hook 源码禁止硬编码本文件已声明规则（hook-rules.test.ts 负向断言）
# 适配器差异: adapters 表声明各端检测链差异（claude 无 sed 单列 / trae 无 touch）
# ═══════════════════════════════════════════════════════════════

# ── §A Bash 裸写保护检测链（core 基线，顺序即优先级）────────────

[[guard.detectors]]
id = "dangerous-command"
regex = 'rm\s+-rf\s+/|DROP\s+TABLE|git\s+push\s+--force|mkfs\.|dd\s+if='
flags = "i"
reason = "危险命令已被阻止"
stderr = "⛔ 危险命令已被阻止: {{cmd}}\n"
# 2026-08-14 Task 9.4.2 上提 core 基线链（回流: I2 能力盘点）——此前仅 claude/qoder/vscode
# 独立链声明（core/trae/codex 有拦截盲区: rm -rf / 直跑不拦）——上提后六端一致。

[[guard.detectors]]
id = "script-interpreter"
regex = '(^|;|\|\||&&|\|)\s*(python3?|node|ruby|perl|php)(\s|$)'
reason = "禁止通过脚本解释器直接修改文件。请使用 Write 或 SearchReplace 工具操作文件。"
stderr = '''⛔ [ADD PreToolUse §A] 阻断: 禁止通过脚本解释器直接修改文件。

  python/node/ruby/perl/php 可在脚本中写入任意文件，绕过:
    · Plan 关联检查（哪个文件属于哪个 ADD Plan？）
    · doc-format-guard（章节/占位符/禁止词校验）
    · 审计追踪（agentAudit 无法感知 Bash 内部的文件变更）

  → 请改用 Write 或 SearchReplace 工具操作文件。
  → 如需运行构建/测试脚本，使用 npx/pnpm/npm 命令。
'''

[[guard.detectors]]
id = "sed-in-place"
regex = '(^|[;&|][ \t]*)sed[ \t]+([^;&|]*[ \t])?(-[A-Za-z]*i[^ \t;&|]*|--in-place(=[^ \t;&|]*)?)([ \t;&|]|$)'
reason = "禁止通过 sed -i 直接编辑文件。请使用 SearchReplace 工具。"
stderr = '''⛔ [ADD PreToolUse §A] 阻断: 禁止通过 sed -i 原地编辑文件。

  sed -i 直接写入文件，绕过 IDE 工具层的所有校验。
  → 请改用 SearchReplace 工具。
'''

[[guard.detectors]]
id = "redirect"
regex = '[>]{1,2}\s+\S'
reason = "禁止通过重定向写入文件。请使用 Write 工具。"
stderr = '''⛔ [ADD PreToolUse §A] 阻断: 禁止通过重定向(>/>>)写入文件。

  重定向写入绕过 IDE 工具层，变更无法追踪。
  → 请改用 Write 工具。
'''

[[guard.detectors]]
id = "tee-dd"
regex = '\btee\b|\bdd\b.*of='
reason = "禁止通过 tee/dd 写入文件。请使用 Write 或 SearchReplace 工具。"
stderr = '''⛔ [ADD PreToolUse §A] 阻断: 禁止通过 tee/dd 写入文件。

  → 请改用 Write 或 SearchReplace 工具。
'''

[[guard.detectors]]
id = "cp-mv-touch"
regex = '(^|;|\|\||&&|\|)\s*(cp|mv|touch)\b'
reason = "禁止通过 cp/mv/touch 操作文件。请使用 Write 或 SearchReplace 工具。"
stderr = '''⛔ [ADD PreToolUse §A] 阻断: 禁止通过 cp/mv/touch 操作文件。

  → 请改用 Write 或 SearchReplace 工具。
'''

