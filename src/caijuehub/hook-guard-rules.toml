# ── §B 敏感文件保护 ──────────────────────────────────────────────

[guard.sensitive_files]
regex = '(^|\/)\.env$|(^|\/)\.env\.production$|(^|\/)\.env\.local$|credentials|secrets'
deny_reason = "敏感文件受保护"
# 2026-08-14 Task 9.4.4① 锚定版（回流: I2 能力盘点）——原宽松后缀匹配误伤 config.env 等普通文件；
# 锚定 (^|\/) 仅匹配路径段首/独立文件名。

# ── §C 模板类型前置注入提示 ──────────────────────────────────────

[[guard.template_hints]]
pattern = 'plan-v\d'
message = "💡 [ADD PreToolUse] 写入 Plan → 模板: standard-plan-template.md（标准）或 simple-plan-template.md（≤3文件）"

[[guard.template_hints]]
pattern = 'add-route'
message = "💡 [ADD PreToolUse] 写入 ADD Route → 模板: add-route-template.md"

[[guard.template_hints]]
pattern = 'handoff'
message = "💡 [ADD PreToolUse] 写入 Handoff → 模板: handoff-single-round-template.md（单轮）或 handoff-multi-round-template.md（多轮）"

# ── §C 阈值 ──────────────────────────────────────────────────────

[guard.thresholds]
large_file_bytes = 2000 # Write 全量覆盖提示阈值（超过建议 SearchReplace 分块）

# ── §C HITL 豁免表（文件名后缀豁免，不触发 HITL 门禁）───────────
# 2026-08-14 Task 9.4.4③: 移除 -implementation（Implementation Review 也走 HITL，回流: I2）

[guard.hitl_exemptions]
suffixes = ["-handoff", "-runtime"]
