name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  # workflow_dispatch 一站式：bump version → commit → tag → publish → release
  bump-and-publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install
      - run: pnpm build
      - run: pnpm lint --max-warnings 0

      - name: Collect changes since last tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --oneline --no-merges "$PREV_TAG..HEAD" | sed 's/^/- /' > /tmp/release-notes.txt
          else
            git log --oneline --no-merges | sed 's/^/- /' > /tmp/release-notes.txt
          fi
          echo "---" >> /tmp/release-notes.txt
          VER=$(node -p "require('./package.json').version")
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...v$VER" >> /tmp/release-notes.txt

      - name: Bump version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1) 先落盘 build 产物（可能含 gen-src-hash 变更）
          git add templates/.add-coder-src-hash.json pnpm-lock.yaml 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(build): auto-generated artifacts"

          # 2) bump 版本，但**先不打 tag**：tag 必须指向「版本已对齐」的那个提交
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VER="$(node -p "require('./package.json').version")"

          # 3) 发布不变量：包版本 == 模板真源版本（templates/.add-coder-src-hash.json._version）
          #    缺这一步时 tag 指向的提交永远滞后一版（0.3.37 实测：包 0.3.37 / 真源 0.3.36），
          #    tests/windows-stability.test.ts 的发布不变量断言会红
          pnpm exec tsx scripts/gen-src-hash.ts
          node -e "const a=require('./package.json').version,b=require('./templates/.add-coder-src-hash.json')._version;if(a!==b){console.error('发布不变量失败：package.json='+a+' 模板真源='+b);process.exit(1)}"

          # 4) 提交 + 打 tag + 推送（提交与 tag 同源）
          git add package.json templates/.add-coder-src-hash.json pnpm-lock.yaml
          git commit -m "v$VER"
          git tag "v$VER"
          git push
          git push --tags
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_COMMITTER_NAME: github-actions[bot]

      - run: pnpm publish --no-git-checks --tag latest

      - name: Create GitHub Release
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.txt
        env:
          GH_TOKEN: ${{ github.token }}
