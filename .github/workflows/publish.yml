name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            echo "skipped=true" >> $GITHUB_OUTPUT
            echo "⏭️  Release ${{ github.ref_name }} 已存在，跳过"
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # registry 幂等（2026-09-16 补）：tag push 也可由重推 tag / 重复 dispatch 触发，
      # 只按"Release 是否存在"去重不够——版本若已在 npm 上，publish 必然 E403 失败（红一条无用流水线）。
      # 故先查 registry：已存在 → 跳过 publish，仅按需补 GitHub Release。
      - name: Check version on registry (idempotent publish)
        id: npmpub
        if: steps.check.outputs.skipped != 'true'
        run: |
          VER="$(node -p "require('./package.json').version")"
          if npm view "add-coder@$VER" version > /dev/null 2>&1; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "⏭️  npm 已有 add-coder@$VER，跳过 publish（仅补 GitHub Release）"
          else
            echo "publish=true" >> $GITHUB_OUTPUT
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.skipped != 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skipped != 'true'
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install
        if: steps.check.outputs.skipped != 'true'
      - run: pnpm build
        if: steps.check.outputs.skipped != 'true'
      - run: pnpm lint --max-warnings 0
        if: steps.check.outputs.skipped != 'true'

      - run: pnpm publish --no-git-checks --tag latest
        if: steps.check.outputs.skipped != 'true' && steps.npmpub.outputs.publish == 'true'

      - name: Collect changes since last tag
        if: steps.check.outputs.skipped != 'true'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}"~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --oneline --no-merges "$PREV_TAG..${{ github.ref_name }}" | sed 's/^/- /' > /tmp/release-notes.txt
          else
            git log --oneline --no-merges "${{ github.ref_name }}" | sed 's/^/- /' > /tmp/release-notes.txt
          fi
          echo "---" >> /tmp/release-notes.txt
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ github.ref_name }}" >> /tmp/release-notes.txt

      - name: Create GitHub Release
        if: steps.check.outputs.skipped != 'true'
        run: |
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file /tmp/release-notes.txt
        env:
          GH_TOKEN: ${{ github.token }}
