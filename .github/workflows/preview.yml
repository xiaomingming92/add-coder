name: preview-publish

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "feat/**"
      - "enhance/**"

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install
      - run: pnpm build

      - name: Commit auto-generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add templates/.add-coder-src-hash.json pnpm-lock.yaml 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(build): auto-generated artifacts"

      - name: Derive preview version
        run: |
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's|/|-|g' | sed 's/[^a-zA-Z0-9-]//g')
          pnpm version prerelease --preid="${BRANCH}" --no-git-tag-version

      - name: Publish preview
        run: pnpm publish --no-git-checks --tag=preview
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
