# 复制为 podman-compose.yml（或 docker-compose.yml）后修改
# 凭据不写在这里，统一在 .env.development 中维护：
#   DATABASE_USER=<DATABASE_USER>
#   DATABASE_PASSWORD=<DATABASE_PASSWORD>
#   DATABASE_PORT=<DATABASE_PORT>
#   PROJECT_NAME=<PROJECT_NAME>

services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: ${PROJECT_NAME:-add-project}-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5433}:5432"
    volumes:
      - ~/data/${PROJECT_NAME:-add-project}/postgres:/var/lib/postgresql/data
    env_file:
      - .env.development
    environment:
      POSTGRES_USER: ${DATABASE_USER:-admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${PROJECT_NAME:-add-project}
      TZ: "Asia/Shanghai"
    networks:
      - ${PROJECT_NAME:-add-project}-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-admin} -d ${PROJECT_NAME:-add-project}"]
      interval: 10s
      timeout: 5s
      retries: 5

# ═══════════════════════════════════════════════════════════════
# Prisma 影子库（migrate dev 必需）
# ═══════════════════════════════════════════════════════════════
# migrate dev 需要一个临时影子库来检测 schema drift，
# SHADOW_DATABASE_URL 指向同一 PG 实例的另一个库即可。
#
# 创建：
#   podman exec ${PROJECT_NAME}-postgres psql -U ${DATABASE_USER} \
#     -c "CREATE DATABASE shadow_${PROJECT_NAME} OWNER ${DATABASE_USER}"
#
# .env.development 中生效配置：
#   SHADOW_DATABASE_URL="postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@localhost:${DATABASE_PORT}/shadow_${PROJECT_NAME}?schema=public"
#
# 首次运行或 shadow 库被清空后需重新创建。
# 不需要在 compose 中额外声明服务——同一个 PG 实例即可。

networks:
  ${PROJECT_NAME:-add-project}-network:
    driver: bridge
