# 复制为 podman-compose.yml（或 docker-compose.yml）后修改
# 凭据不写在这里，统一在 .env.development 中维护：
#   DATABASE_USER=<DATABASE_USER>
#   DATABASE_PASSWORD=<DATABASE_PASSWORD>
#   DATABASE_PORT=<DATABASE_PORT>
#   PROJECT_NAME=<PROJECT_NAME>
#
# 镜像选择：pgvector/pgvector:pg16 自带 pg_trgm + vector——
#   ① 记忆子系统的向量通道（add_memory_vector / prisma/raw-objects-vector.sql）需要 vector 扩展；
#   ② Atlas dev 沙箱库从 template1 重建，template1 缺扩展会导致期望态里的
#      gin_trgm_ops / vector 无法解析（db-ensure 每次 diff 前会幂等补齐 template1 扩展）。
#   若目标环境没有 pgvector，记忆检索按 fts-only 合法降级（degradedMode 明示），不是硬失败。

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: ${PROJECT_NAME:-add-project}-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5433}:5432"
    volumes:
      - ~/data/${PROJECT_NAME:-add-project}/postgres:/var/lib/postgresql/data
    env_file:
      - .env.development
    environment:
      POSTGRES_USER: ${DATABASE_USER:-admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${PROJECT_NAME:-add-project}
      TZ: "Asia/Shanghai"
    networks:
      - ${PROJECT_NAME:-add-project}-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-admin} -d ${PROJECT_NAME:-add-project}"]
      interval: 10s
      timeout: 5s
      retries: 5

  shadow-postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: ${PROJECT_NAME:-add-project}-shadow
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SHADOW_DB_PORT:-5434}:5432"
    volumes:
      - ~/data/${PROJECT_NAME:-add-project}/shadow-postgres:/var/lib/postgresql/data
    env_file:
      - .env.development
    environment:
      POSTGRES_USER: ${SHADOW_DB_USER:-${DATABASE_USER:-admin}}
      POSTGRES_PASSWORD: ${SHADOW_DB_PASSWORD:-${DATABASE_PASSWORD:-change-me-in-production}}
      POSTGRES_DB: ${SHADOW_DB_NAME:-add-coder-shadow}
      TZ: "Asia/Shanghai"
    networks:
      - ${PROJECT_NAME:-add-project}-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHADOW_DB_USER:-${DATABASE_USER:-admin}} -d ${SHADOW_DB_NAME:-add-coder-shadow}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ${PROJECT_NAME:-add-project}-network:
    driver: bridge
